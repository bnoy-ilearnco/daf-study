name: Update shiurim

on:
  schedule:
    - cron: "17 22 * * *"   # once a day, 6:17 PM New York time (5:17 PM in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/update_shiurim.py
      - .github/workflows/update-shiurim.yml

permissions:
  contents: write

concurrency:
  group: update-shiurim
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Rabbi Brown's shiurim
        run: python tools/update_shiurim.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- shiurim.js; then
            echo "No new shiurim today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add shiurim.js
          git commit -m "Update shiurim list"
          git push
