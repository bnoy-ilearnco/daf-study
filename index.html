<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daf Study Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a reader's desk. Daf grid on the left, the amud in the middle, the shiur on a bar along the bottom. */
:root{
  --bg:#ecebe6; --panel:#fafaf7; --ink:#1f2328; --muted:#646b73; --line:#d9d8d1;
  --accent:#2f5d62; --accent-ink:#ffffff; --accent-soft:#dde8e7; --done:#3f7a4a; --chip:#eeede7; --paper:#ffffff;
  --he:"Frank Ruhl Libre","Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15181a; --panel:#1d2124; --ink:#e7e9ea; --muted:#9aa2a8; --line:#2f3539;
    --accent:#7fb3b8; --accent-ink:#0f1416; --accent-soft:#22363a; --done:#86c08f; --chip:#262b2f; --paper:#f4f3ee; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#15181a; --panel:#1d2124; --ink:#e7e9ea; --muted:#9aa2a8; --line:#2f3539;
  --accent:#7fb3b8; --accent-ink:#0f1416; --accent-soft:#22363a; --done:#86c08f; --chip:#262b2f; --paper:#f4f3ee; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);overflow:hidden}
button,select,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"top top" "side main" "player player"}

/* top bar */
header{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel)}
.iconbtn:hover{background:var(--chip)}
.iconbtn:disabled{opacity:.35;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{padding:8px 13px;min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35;cursor:default}
.seg .he{font-size:17px}
.dafnav{display:flex;align-items:center;gap:6px}
.daflabel{min-width:130px;text-align:center;line-height:1.1}
.daflabel .he{display:block;font-size:22px;font-weight:700}
.daflabel small{color:var(--muted);font-size:12px;letter-spacing:.02em}
.spacer{flex:1}
.learn{padding:8px 13px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.learn.on{background:var(--done);border-color:var(--done);color:#fff}

/* sidebar */
aside{grid-area:side;width:260px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
.prog{font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{position:relative;padding:7px 0 6px;border-radius:8px;background:var(--chip);text-align:center;line-height:1.05;border:1px solid transparent}
.cell:hover{border-color:var(--accent)}
.cell .he{display:block;font-size:16px}
.cell .n{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.cur{background:var(--accent);color:var(--accent-ink)}
.cell.cur .n{color:var(--accent-ink)}
.cell.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:10px;color:var(--done)}
.cell.cur.done::after{color:var(--accent-ink)}
.cell .c13{position:absolute;top:5px;left:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cell.cur .c13{background:var(--accent-ink)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:12px 2px 0;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.updated{font-size:11.5px;color:var(--muted);margin:10px 2px 0}
.legend i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}

/* reader */
main{grid-area:main;min-width:0;min-height:0;display:flex;flex-direction:column}
.tools{display:flex;align-items:center;gap:8px;padding:8px 16px 0;color:var(--muted);font-size:12.5px}
.tools .iconbtn{width:34px;height:34px;font-size:16px}
.pages{flex:1;min-height:0;display:flex;gap:12px;padding:8px 16px 12px}
.page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.page .cap{display:flex;justify-content:space-between;align-items:baseline;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.page .cap .he{font-size:15px;color:var(--ink)}
.scroll{flex:1;min-height:0;overflow:auto;background:var(--paper);-webkit-overflow-scrolling:touch}
.scroll canvas{display:block;margin:0 auto}
.msg{padding:28px 16px;text-align:center;color:#555}

/* player */
footer{grid-area:player;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:9px}
.shiurim{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.shiurim .lbl{color:var(--muted);font-size:12.5px;margin-right:2px}
.chip{padding:7px 12px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:13px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .t{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.chip .note{color:var(--muted);font-weight:400;font-size:12px}
.chip .pref{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.controls{display:flex;align-items:center;gap:10px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.skip{padding:8px 10px;border-radius:9px;font-size:12.5px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:46px;text-align:center}
input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
select{padding:7px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.out{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.openbtn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;min-height:46px}
.openbtn svg{width:16px;height:16px;fill:currentColor}
.hint{font-size:12.5px;color:var(--muted);max-width:60ch}
.ext{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.ext:hover{color:var(--accent)}

@media (max-width:900px){
  aside{position:fixed;z-index:5;left:0;top:0;bottom:0;box-shadow:0 8px 30px rgba(0,0,0,.25);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .daflabel{min-width:96px}
  .tools .keys{display:none}
}
@media (max-width:640px){
  header{gap:8px}
  .pages{flex-direction:column;overflow:auto}
  .page{flex:none;min-height:70vh}
  .time{min-width:38px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>


<div class="app">
<header>
  <button class="iconbtn" id="toggleSide" aria-label="Show or hide the daf list" title="Daf list">☰</button>
  <div class="seg" id="tracSeg" aria-label="Masechta"></div>
  <div class="dafnav">
    <button class="iconbtn" id="prev" aria-label="Previous daf" title="Previous daf ( [ )">‹</button>
    <div class="daflabel" id="dafLabel"></div>
    <button class="iconbtn" id="next" aria-label="Next daf" title="Next daf ( ] )">›</button>
  </div>
  <div class="seg" id="amudSeg" aria-label="Amud">
    <button data-v="a"><span class="he">עמוד א</span></button>
    <button data-v="b"><span class="he">עמוד ב</span></button>
    <button data-v="both">Both</button>
  </div>
  <span class="spacer"></span>
  <button class="learn" id="learnBtn" title="Mark this daf as learned">✓ Learned</button>
</header>

<aside id="side" hidden>
  <div class="prog"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
  <div class="grid" id="grid"></div>
  <div class="legend"><span><i></i>Cycle 13 shiur</span><span>✓ learned</span></div>
  <p class="updated" id="updated"></p>
</aside>

<main>
  <div class="tools">
    <button class="iconbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
    <button class="iconbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
    <button class="skip" id="zoomFit" title="Fit to width">Fit width</button>
    <span id="zoomTxt"></span>
    <span class="spacer"></span>
    <span class="keys">Keys: Space play · ← → skip · [ ] daf · A / B amud</span>
  </div>
  <div class="pages" id="pages"></div>
</main>

<footer>
  <div class="shiurim" id="shiurim"></div>
  <div class="controls" id="inline">
    <button class="play" id="play" aria-label="Play or pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></button>
    <button class="skip" id="back" title="Back 15 seconds">−15</button>
    <button class="skip" id="fwd" title="Forward 30 seconds">+30</button>
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in shiur">
    <span class="time" id="dur">0:00</span>
    <select id="rate" aria-label="Playback speed"><option>0.75</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
    <a class="ext" id="ext1" target="_blank" rel="noopener">Open MP3 ↗</a>
  </div>
  <div class="out" id="outside" hidden>
    <a class="openbtn" id="openBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg><span id="openTxt">Play shiur</span></a>
    <span class="hint">This shiur didn't load in the page. Open it in a new tab instead, or check your connection and reload.</span>
  </div>
</footer>
</div>
<audio id="audio" preload="metadata"></audio>

<script src="pdf.min.js"></script>
<script src="shiurim.js"></script>
<script>
/* ===== Shiurim: loaded from shiurim.js, refreshed daily by .github/workflows/update-shiurim.yml ===== */
const ALL = window.SHIURIM || {y:[], b:[]};
const seriesLabel = s => s==="c13" ? "Cycle 13" : s==="old" ? "Earlier series" : s.startsWith("dy") ? "Daf Yomi "+s.slice(2) : s;
const seriesRank = s => s==="c13" ? 0 : s.startsWith("dy") ? 1 + (3000-(+s.slice(2)||0))/10000 : 2;
function buildTractate(o){
  const by={}; for(let d=o.first; d<=o.last; d++) by[d]=[];
  for(const e of (ALL[o.key]||[])){
    const s={series:e.s, part:e.part||1, len:e.len, date:e.date, note:e.note, url:e.url};
    for(const d of e.d) if(by[d]) by[d].push(s);
  }
  for(const d in by) by[d].sort((a,b)=>seriesRank(a.series)-seriesRank(b.series) || a.part-b.part);
  return Object.assign(o,{byDaf:by});
}
const TR = {
  y: buildTractate({key:"y", en:"Yevamos", he:"יבמות", first:2, last:122, lastB:true}),
  b: buildTractate({key:"b", en:"Bechoros", he:"בכורות", first:2, last:61, lastB:false})
};

/* ===== Hebrew numerals ===== */
function heb(n){
  const H=[[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"],[90,"צ"],[80,"פ"],[70,"ע"],[60,"ס"],[50,"נ"],[40,"מ"],[30,"ל"],[20,"כ"],[10,"י"],[9,"ט"],[8,"ח"],[7,"ז"],[6,"ו"],[5,"ה"],[4,"ד"],[3,"ג"],[2,"ב"],[1,"א"]];
  let s="", r=n%100, h=n-r;
  for(const [v,c] of H) while(h>=v){s+=c;h-=v;}
  if(r===15) return s+"טו"; if(r===16) return s+"טז";
  for(const [v,c] of H) while(r>=v){s+=c;r-=v;}
  return s;
}
const pdfPath = (t,d,a) => `${t}/${String(d).padStart(3,"0")}${a}.pdf`;

/* ===== Per-viewer storage ===== */
const store = {
  get(k,def){ try{ const v=localStorage.getItem("dsp:"+k); return v==null?def:JSON.parse(v);}catch(e){return def} },
  set(k,v){ try{ localStorage.setItem("dsp:"+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  t: store.get("t","y"),
  daf: store.get("daf",{y:2,b:2}),
  amud: store.get("amud","a"),
  side: store.get("side", innerWidth>900),
  done: store.get("done",{}),
  pos: store.get("pos",{}),
  heard: store.get("heard",{}),
  rate: store.get("rate",1),
  zoom: store.get("zoom",1)
};
const T = () => TR[S.t];
const curDaf = () => S.daf[S.t];
const $ = id => document.getElementById(id);
const audio = $("audio");
let current = null;
let audioOK = null;   // null unknown, true plays inline, false blocked -> open in new tab

/* ===== PDF rendering ===== */
const pdfReady = !!window.pdfjsLib;
if(pdfReady) pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
const docs = new Map();
function getDoc(url){
  if(!docs.has(url)){
    const p = pdfjsLib.getDocument({url, isEvalSupported:false, disableFontFace:true}).promise;
    p.catch(()=>docs.delete(url));
    docs.set(url,p);
  }
  return docs.get(url);
}
let renderGen = 0;
async function renderCanvas(box, url, gen){
  const msg = t => { box.innerHTML = `<div class="msg">${t}</div>`; };
  if(!pdfReady){ msg("The page viewer did not load. Check your connection and reload."); return; }
  try{
    const doc = await getDoc(url); if(gen!==renderGen) return;
    const page = await doc.getPage(1); if(gen!==renderGen) return;
    const base = page.getViewport({scale:1});
    const avail = Math.max(200, box.clientWidth - 2);
    const cssScale = avail/base.width*S.zoom;
    const dpr = Math.min(window.devicePixelRatio||1, 3);
    const vp = page.getViewport({scale: cssScale*dpr});
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width/dpr)+"px"; c.style.height = Math.floor(vp.height/dpr)+"px";
    await page.render({canvasContext:c.getContext("2d"), viewport:vp, intent:"print"}).promise;
    if(gen!==renderGen) return;
    box.replaceChildren(c);
  }catch(e){ if(gen===renderGen) msg("This amud could not be loaded."); }
}
function renderPages(){
  const t=T(), d=curDaf(), wrap=$("pages");
  const hasB = d<t.last || t.lastB;
  let amud = S.amud; if(amud!=="a" && !hasB) amud="a";
  const list = amud==="both" ? ["a","b"] : [amud];
  const gen = ++renderGen;
  wrap.replaceChildren();
  for(const a of list){
    const p=document.createElement("section"); p.className="page";
    p.innerHTML=`<div class="cap"><span class="he">${t.he} ${heb(d)}${a==="a"?".":":"}</span><span>${t.en} ${d}${a}</span></div><div class="scroll"><div class="msg">Loading…</div></div>`;
    wrap.appendChild(p);
    renderCanvas(p.querySelector(".scroll"), pdfPath(t.key,d,a), gen);
  }
  document.querySelectorAll("#amudSeg button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===amud);
    b.disabled = !hasB && b.dataset.v!=="a";
  });
  $("zoomTxt").textContent = Math.round(S.zoom*100)+"%";
  // warm the next daf
  if(pdfReady && d<t.last) setTimeout(()=>{ if(gen===renderGen){ getDoc(pdfPath(t.key,d+1,"a")); } }, 1500);
}
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(renderPages,250); });
function setZoom(z){ S.zoom=Math.max(.6,Math.min(3,Math.round(z*10)/10)); store.set("zoom",S.zoom); renderPages(); }
$("zoomIn").onclick=()=>setZoom(S.zoom+0.2);
$("zoomOut").onclick=()=>setZoom(S.zoom-0.2);
$("zoomFit").onclick=()=>setZoom(1);

/* ===== Header, grid ===== */
function renderTracSeg(){
  const seg=$("tracSeg"); seg.replaceChildren();
  for(const k of Object.keys(TR)){
    const b=document.createElement("button");
    b.innerHTML=`<span class="he">${TR[k].he}</span>`; b.title=TR[k].en;
    b.classList.toggle("on", k===S.t);
    b.onclick=()=>switchTractate(k);
    seg.appendChild(b);
  }
}
function renderHeader(){
  const t=T(), d=curDaf();
  $("dafLabel").innerHTML=`<span class="he">דף ${heb(d)}</span><small>${t.en} ${d}</small>`;
  $("learnBtn").classList.toggle("on", !!S.done[t.key+d]);
  $("prev").disabled = d<=t.first; $("next").disabled = d>=t.last;
  document.title = `${t.en} ${d} · Daf Study Player`;
}
function renderGrid(){
  const t=T(), g=$("grid"); g.replaceChildren();
  let doneN=0;
  for(let d=t.first; d<=t.last; d++){
    const list=t.byDaf[d], has13=list.some(s=>s.series==="c13");
    const c=document.createElement("button");
    const done=!!S.done[t.key+d]; if(done) doneN++;
    c.className="cell"+(d===curDaf()?" cur":"")+(done?" done":"");
    c.title=`${t.en} ${d}: ${list.length} shiur${list.length===1?"":"im"}${has13?", Cycle 13 available":""}`;
    c.innerHTML=`${has13?'<span class="c13"></span>':""}<span class="he">${heb(d)}</span><span class="n">${d}</span>`;
    c.onclick=()=>{ goDaf(d); if(innerWidth<=900) toggleSide(false); };
    g.appendChild(c);
  }
  const tot=t.last-t.first+1;
  $("progTxt").textContent=`${t.en}: ${doneN} of ${tot} dapim learned`;
  $("progBar").style.width=(doneN/tot*100)+"%";
  const cur=g.querySelector(".cur"); if(cur && !$("side").hidden) cur.scrollIntoView({block:"nearest"});
}

/* ===== Shiurim and audio ===== */
const fmt = t => { if(!isFinite(t)) return "0:00"; t=Math.floor(t); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0"); };
const label = s => seriesLabel(s.series) + (s.part>1?" · part "+s.part:"");
function renderShiurim(){
  const box=$("shiurim"); box.replaceChildren();
  const list=T().byDaf[curDaf()];
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent="Shiurim on this daf:"; box.appendChild(lbl);
  if(!list.length){ const e=document.createElement("span"); e.className="hint"; e.textContent="Rabbi Brown has no shiur on this daf in the archive."; box.appendChild(e); return; }
  list.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="chip"+(current===s?" on":"");
    b.title=[s.date&&("Recorded "+s.date), s.note].filter(Boolean).join(" · ");
    b.innerHTML=`${i===0&&s.series==="c13"?'<span class="pref">Preferred</span>':""}${label(s)}<span class="t">${s.len}</span>${s.note?`<span class="note">${s.note}</span>`:""}${S.heard[s.url]?'<span style="color:var(--done)">✓</span>':""}`;
    b.onclick=()=>select(s,true);
    box.appendChild(b);
  });
}
function applyMode(){
  $("inline").hidden = audioOK===false;
  $("outside").hidden = audioOK!==false;
}
function select(s, userAction){
  if(current!==s){
    savePos();
    current=s;
    $("ext1").href=s.url; $("openBtn").href=s.url;
    $("openTxt").textContent=`Play ${label(s)} · ${s.len}`;
    if(audioOK!==false){
      audio.src=s.url;
      const resume=S.pos[s.url]||0;
      audio.onloadedmetadata=()=>{ audioOK=true; applyMode(); if(resume && resume<audio.duration-5) audio.currentTime=resume; audio.playbackRate=S.rate; updateTime(); };
    }
    if("mediaSession" in navigator) try{ navigator.mediaSession.metadata=new MediaMetadata({title:`${T().en} ${curDaf()}`, artist:"Rabbi Moshe Brown", album:label(s)}); }catch(e){}
  }
  if(userAction && audioOK!==false) audio.play().catch(()=>{});
  renderShiurim(); updateTime();
}
function pickDefault(){
  const list=T().byDaf[curDaf()];
  if(!list.length){ audio.pause(); savePos(); current=null; audio.removeAttribute("src"); renderShiurim(); updateTime(); return; }
  select(list.find(s=>s.series==="c13") || list[0], false);
}
function savePos(){ if(current && audio.currentTime>0){ S.pos[current.url]=Math.floor(audio.currentTime); store.set("pos",S.pos); } }
function updateTime(){
  $("cur").textContent=fmt(audio.currentTime||0);
  $("dur").textContent=current?(isFinite(audio.duration)?fmt(audio.duration):current.len):"0:00";
  $("seek").value=audio.duration?(audio.currentTime/audio.duration*1000):0;
}
function blockAudio(){ if(audioOK===true) return; audioOK=false; applyMode(); }
audio.addEventListener("error", blockAudio);
document.addEventListener("securitypolicyviolation", e=>{ if(/cloudfront/.test(e.blockedURI||"")) blockAudio(); });
let lastSave=0;
audio.addEventListener("timeupdate",()=>{
  updateTime();
  if(Date.now()-lastSave>5000){ lastSave=Date.now(); savePos(); }
  if(current && audio.duration && audio.currentTime/audio.duration>.9 && !S.heard[current.url]){ S.heard[current.url]=true; store.set("heard",S.heard); renderShiurim(); }
});
audio.addEventListener("play",()=>$("playIcon").innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>');
audio.addEventListener("pause",()=>{ $("playIcon").innerHTML='<path d="M7 4l14 8-14 8z"/>'; savePos(); });
$("openBtn").addEventListener("click",()=>{ if(current){ S.heard[current.url]=true; store.set("heard",S.heard); setTimeout(renderShiurim,50);} });
$("play").onclick=()=>{ if(!current) return; audio.paused?audio.play().catch(()=>{}):audio.pause(); };
$("back").onclick=()=>{ audio.currentTime=Math.max(0,audio.currentTime-15); };
$("fwd").onclick=()=>{ audio.currentTime=Math.min(audio.duration||1e9,audio.currentTime+30); };
$("seek").oninput=e=>{ if(audio.duration) audio.currentTime=e.target.value/1000*audio.duration; };
$("rate").value=String(S.rate);
$("rate").onchange=e=>{ S.rate=+e.target.value; audio.playbackRate=S.rate; store.set("rate",S.rate); };
addEventListener("pagehide",savePos);

/* ===== Navigation ===== */
function goDaf(d){
  const t=T(); d=Math.max(t.first,Math.min(t.last,d));
  const changed = d!==curDaf();
  S.daf[S.t]=d; store.set("daf",S.daf);
  if(changed && S.amud==="b"){ S.amud="a"; store.set("amud","a"); }
  try{ history.replaceState(null,"","#"+t.key+d); }catch(e){}
  renderHeader(); renderPages(); renderGrid();
  if(changed || !current) pickDefault(); else renderShiurim();
}
function switchTractate(k){
  if(k===S.t) return;
  savePos(); audio.pause();
  S.t=k; store.set("t",k); current=null;
  renderTracSeg(); goDaf(curDaf()); pickDefault();
}
function setAmud(a){ S.amud=a; store.set("amud",a); renderPages(); }
function toggleSide(force){ S.side = force===undefined ? !S.side : force; store.set("side",S.side); $("side").hidden=!S.side; if(S.side) renderGrid(); setTimeout(renderPages,0); }
$("prev").onclick=()=>goDaf(curDaf()-1);
$("next").onclick=()=>goDaf(curDaf()+1);
$("toggleSide").onclick=()=>toggleSide();
document.querySelectorAll("#amudSeg button").forEach(b=>b.onclick=()=>setAmud(b.dataset.v));
$("learnBtn").onclick=()=>{ const k=T().key+curDaf(); S.done[k]=!S.done[k]; store.set("done",S.done); renderHeader(); renderGrid(); };
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k===" "){ e.preventDefault(); if(audioOK!==false) $("play").click(); }
  else if(k==="ArrowLeft"){ e.preventDefault(); $("back").click(); }
  else if(k==="ArrowRight"){ e.preventDefault(); $("fwd").click(); }
  else if(k==="["){ goDaf(curDaf()-1); }
  else if(k==="]"){ goDaf(curDaf()+1); }
  else if(k==="a"||k==="A"){ setAmud("a"); }
  else if(k==="b"||k==="B"){ setAmud("b"); }
});

/* ===== Start ===== */
(function init(){
  const m=(location.hash||"").match(/^#([yb])(\d+)$/);
  if(m && TR[m[1]]){ S.t=m[1]; S.daf[m[1]]=+m[2]; }
  if(!TR[S.t]) S.t="y";
  $("side").hidden=!S.side;
  if(window.SHIURIM_UPDATED) $("updated").textContent="Shiur list last changed "+window.SHIURIM_UPDATED+". Checked daily.";
  renderTracSeg(); applyMode(); goDaf(curDaf());
})();
</script>
